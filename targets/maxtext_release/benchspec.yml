schema_version: 1

model_domain: llm
workload_type: train
benchmark_goal: throughput

metrics:
  tflops_per_device:
    role: sample
    lines: "completed step"
    step: step
    value: "TFLOP/s/device"
    better: higher

  step_time_seconds:
    role: sample
    lines: "completed step"
    step: step
    value: "seconds"
    better: lower

  median_tflops_per_device:
    role: aggregate
    from: tflops_per_device
    op: median
    skip_first: 3

  median_step_time_seconds:
    role: aggregate
    from: step_time_seconds
    op: median
    skip_first: 3

  tflops_regression_pct:
    role: comparison
    from: median_tflops_per_device
    better: higher
    threshold: 10
    baselines:
      gemma3_4b: 460
      llama3_1_8b: 440
      mixtral_8x7b: 178
      deepseek2_16b: 90
      qwen3_14b: 445
      gpt_oss_20b: 85
      olmo3_7b: 467
 

