# https://huggingface.co/openai/gpt-oss-20b/blob/main/config.json
# tokenizer_type: "huggingface"

# model config for gpt-oss-20b
base_config: "base.yml"

steps: 15
hardware: "gpu"
model_name: "gpt-oss-20b"
dataset_type: "synthetic"
attention: "dot_product"
enable_checkpointing: False
max_segments_per_seq: 32

# Disable Megablox/Pallas sparse MoE kernels for ROCm
megablox: False
sparse_matmul: False

# Attention
base_emb_dim: 2880
base_num_query_heads: 64
base_num_kv_heads: 8
head_dim: 64
sliding_window_size: 128
attention_bias: true
attention_sink: true

# RoPE
rope_type: "yarn"
rope_max_timescale: 150_000
max_position_embeddings: 131072
original_max_position_embeddings: 4096
rope_factor: 32
beta_fast: 32
beta_slow: 1
rope_interleave: false
rope_truncate: false
rope_attention_scaling: true

# MLP
base_mlp_dim: 2880
base_moe_mlp_dim: 2880
mlp_activations: ["sigmoid","linear"]
mlp_activations_limit: 7.0
routed_bias: true
mlp_bias: true
num_experts: 32
num_experts_per_tok: 4

# General
base_num_decoder_layers: 24
vocab_size: 201088
normalization_layer_epsilon: 1.0e-5
enable_dropout: false
logits_via_embedding: false
decoder_block: "gpt_oss"
inhomogeneous_layer_cycle_interval: 2
