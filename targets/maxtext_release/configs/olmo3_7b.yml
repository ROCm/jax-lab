# https://huggingface.co/allenai/Olmo-3-7B-Instruct

# AllenAI OLMo 3 7B Configuration
base_config: "base.yml"

steps: 15
hardware: "gpu"
model_name: "olmo3-7b"
dataset_type: "synthetic"
attention: "dot_product"
enable_checkpointing: False
max_segments_per_seq: 32

decoder_block: "olmo3"

# Model Dimensions
base_emb_dim: 4096
base_num_query_heads: 32
base_num_kv_heads: 32
base_mlp_dim: 11008
base_num_decoder_layers: 32
head_dim: 128

# Activations & Normalization
mlp_activations: ["silu", "linear"] # SwiGLU
normalization_layer_epsilon: 1.e-6
use_qk_norm: true

# Attention
# Layers 0,1,2 use sliding window 4096. Layer 3 uses global. Repeats.
sliding_window_size: 4096
inhomogeneous_layer_cycle_interval: 4

# RoPE
# Yarn RoPE for global attention, default RoPE for sliding window attention (set from olmo3.py)
rope_type: "yarn"
rope_interleave: false
rope_max_timescale: 500000 # rope_theta
rope_factor: 8.0 # factor so 0.1 * ln(rope_factor) + 1.0 = 1.2079441541679836
original_max_position_embeddings: 8192
beta_fast: 32.0
beta_slow: 1.0
max_position_embeddings: 65536
rope_attention_scaling: true
rope_truncate: true  # HF transformers defaults truncate=true for YaRN; matches HF correction-range floor/ceil

# Embeddings
vocab_size: 100278
logits_via_embedding: false
normalize_embedding_logits: false
