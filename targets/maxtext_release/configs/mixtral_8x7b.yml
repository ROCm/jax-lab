# tokenizer_path is assets/tokenizers/tokenizer.mistral-v1

# model config for mixtral-8x7b
base_config: "base.yml"

steps: 15
hardware: "gpu"
model_name: "mixtral-8x7b"
dataset_type: "synthetic"
attention: "dot_product"
enable_checkpointing: False
max_segments_per_seq: 32

# Disable Megablox/Pallas sparse MoE kernels for ROCm
megablox: False
sparse_matmul: False

base_emb_dim: 4096
base_num_query_heads: 32
base_num_kv_heads: 8
base_mlp_dim: 14336
base_moe_mlp_dim: 14336
base_num_decoder_layers: 32
head_dim: 128
mlp_activations: ["silu","linear"]
vocab_size: 32000
enable_dropout: false
logits_via_embedding: false
normalization_layer_epsilon: 1.0e-5
num_experts: 8
num_experts_per_tok: 2
rope_max_timescale: 1_000_000
decoder_block: "mixtral"
