name: "JAX Release Validation Benchmarks"

on:
  workflow_dispatch:
    inputs:
      run-number:
        description: "Release validation workflow run number from ROCm/jax"
        required: true
        type: string
      jax-wheel-source:
        description: "Where to get jax/jaxlib wheels the ROCm plugin runs against"
        required: false
        type: choice
        default: pypi
        options:
          - pypi
          - gcs
      jax-gcs-uri:
        description: "GCS URI (dir/prefix) holding jax + jaxlib wheels - required when jax-wheel-source=gcs (e.g. gs://my-bucket/path)"
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

# --- Release-specific config (update per release branch) ---
env:
  RELEASE_REPO: "ROCm/jax"
  RELEASE_BRANCH: "amd-main"

# TODO: Once Rock issues have been resolved, update the image referenced here.
jobs:
  benchmark:
    name: "${{ matrix.rocm.label }} / ${{ matrix.benchmark.workload }} / ${{ matrix.benchmark.gpu_count }}gpu"
    runs-on: amd-do-linux.jax.gpu.gfx950.${{ matrix.benchmark.gpu_count }}
    strategy:
      fail-fast: false
      matrix:
        rocm:
          - {label: "ROCm 7.2.0", release-version: "7.2.0", image: "ghcr.io/rocm/jax-base-ubu24.rocm720:latest", xla-flags: ""}
          - {label: "TheRock 7.14.0", release-version: "therock-7.14.0", image: "ghcr.io/rocm/jax-base-ubu24.therock-latest", xla-flags: ""}
        benchmark:
          - {target: "maxtext_release", workload: "gemma3_4b", gpu_count: 8}
          - {target: "maxtext_release", workload: "llama3_1_8b", gpu_count: 8}
          - {target: "maxtext_release", workload: "mixtral_8x7b", gpu_count: 8}
          - {target: "maxtext_release", workload: "deepseek2_16b", gpu_count: 8}
          - {target: "maxtext_release", workload: "qwen3_14b", gpu_count: 8}
          - {target: "maxtext_release", workload: "gpt_oss_20b", gpu_count: 8}
          - {target: "maxtext_release", workload: "olmo3_7b", gpu_count: 8}
          - {target: "flax_release", workload: "convolution", gpu_count: 4}
          - {target: "flax_release", workload: "resnet", gpu_count: 4}
          - {target: "flax_release", workload: "nlp_seq", gpu_count: 4}
          - {target: "hf_diffusers_release", workload: "stable_diffusion", gpu_count: 1}
          - {target: "hf_transformers_release", workload: "gpt_j_6b", gpu_count: 8}
          - {target: "hf_transformers_release", workload: "flan_t5_large", gpu_count: 8}
    
    container:
      image: ${{ matrix.rocm.image }}
      options: >-
        --device=/dev/kfd
        --device=/dev/dri
        --security-opt seccomp=unconfined
        --group-add video
        --shm-size 64G
        --env-file /etc/podinfo/gha-gpu-isolation-settings
   
    defaults:
      run:
        shell: bash

    env:
      TARGET: ${{ matrix.benchmark.target }}
      WORKLOAD: ${{ matrix.benchmark.workload }}
      GPU_COUNT: ${{ matrix.benchmark.gpu_count }}
      JAXLIB_VERSION: release
      PYTHON_VERSION: "3.12"
      COMBO: "${{ matrix.rocm.label }}-${{ matrix.benchmark.gpu_count }}gpu-${{ matrix.benchmark.workload }}"
      RUNNER: "amd-do-linux.jax.gpu.gfx950.${{ matrix.benchmark.gpu_count }}"
      ROCM_VERSION: "${{ matrix.rocm.release-version }}"
      ROCM_TAG: "${{ matrix.rocm.release-version }}"
      JAX_WHEEL_SOURCE: ${{ inputs.jax-wheel-source }}
      JAX_GCS_URI: ${{ inputs.jax-gcs-uri }}
      XLA_FLAGS: ${{ matrix.rocm.xla-flags }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          RUN_NUMBER="${{ inputs.run-number }}"
          if ! echo "$RUN_NUMBER" | grep -qP '^\d+$'; then
            echo "ERROR: Invalid run-number: '$RUN_NUMBER'. Must be a positive integer."
            exit 1
          fi

          # If GCS URI is selected, first validate it.
          if [[ "${JAX_WHEEL_SOURCE}" == "gcs" ]]; then
            if [[ -z "${JAX_GCS_URI}" ]]; then
              echo "ERROR: jax-gcs-uri is required when jax-wheel-source=gcs."
              exit 1
            fi

            # Allowed buckets and their expected path schemes:
            #   jax-nightly-artifacts   : all_nightlies/<YYYY-MM-DD>-<build-id>
            #   jax-release-artifacts   : <version>/rc<N>/release
            #                             e.g. 0.11.0/rc2/release
            #   general-ml-ci-transient : jax-github-actions/jax/CI - Wheel Tests (Continuous)/<run>/<attempt>
            NIGHTLY_BUCKET="jax-nightly-artifacts"
            RELEASE_BUCKET="jax-release-artifacts"
            CONTINUOUS_BUCKET="general-ml-ci-transient"

            # Nightly bucket
            if [[ "${JAX_GCS_URI}" == "gs://${NIGHTLY_BUCKET}/"* ]]; then
              path="${JAX_GCS_URI#gs://${NIGHTLY_BUCKET}/}"
              if [[ "${path}" != all_nightlies/* || "${path}" == *[^A-Za-z0-9._/-]* ]]; then
                echo "ERROR: ${NIGHTLY_BUCKET} path must be under all_nightlies/ with no spaces or glob characters (got: '${path}')."
                exit 1
              fi

            # Release bucket
            elif [[ "${JAX_GCS_URI}" == "gs://${RELEASE_BUCKET}/"* ]]; then
              path="${JAX_GCS_URI#gs://${RELEASE_BUCKET}/}"
              path="${path%/}"
              if [[ ! "${path}" =~ ^[0-9]+\.[0-9]+\.[0-9]+/rc[0-9]+/release$ ]]; then
                echo "ERROR: ${RELEASE_BUCKET} path must look like <version>/rc<N>/release, e.g. 0.11.0/rc2/release (got: '${path}')."
                exit 1
              fi

            # Continuous bucket
            elif [[ "${JAX_GCS_URI}" == "gs://${CONTINUOUS_BUCKET}/"* ]]; then
              path="${JAX_GCS_URI#gs://${CONTINUOUS_BUCKET}/}"
              path="${path%/}"
              # Fixed prefix contains spaces and parens; only <run>/<attempt> vary.
              continuous_re='^jax-github-actions/jax/CI - Wheel Tests \(Continuous\)/[0-9]+/[0-9]+$'
              if [[ ! "${path}" =~ $continuous_re ]]; then
                echo "ERROR: ${CONTINUOUS_BUCKET} path must look like 'jax-github-actions/jax/CI - Wheel Tests (Continuous)/<run>/<attempt>' (got: '${path}')."
                exit 1
              fi

            # Unrecognized bucket
            else
              echo "ERROR: jax-gcs-uri must be under gs://${NIGHTLY_BUCKET}/, gs://${RELEASE_BUCKET}/, or gs://${CONTINUOUS_BUCKET}/ (got: '${JAX_GCS_URI}')."
              exit 1
            fi

          fi

      - name: Set S3 wheels URI
        run: |
          echo "S3_WHEELS_URI=s3://jax-ci-amd/rocm-wheels/${RELEASE_REPO}/${RELEASE_BRANCH}/${{ matrix.rocm.release-version }}/release-validation/${{ inputs.run-number }}/1" >> "$GITHUB_ENV"
      - name: Install missing tools
        run: |
          apt-get update -qq && apt-get install -y -qq wget
      - name: Run benchmark
        timeout-minutes: 60
        run: ./targets/${TARGET}/run.sh "${WORKLOAD}"

      - name: Print results
        if: always()
        run: |
          RESULT_FILE="targets/${TARGET}/run_artifacts/${WORKLOAD}/result.json"
          if [[ -f "${RESULT_FILE}" ]]; then
            echo "=== Results ==="
            cat "${RESULT_FILE}" | python3 -m json.tool
          else
            echo "No result.json found at ${RESULT_FILE}"
          fi
